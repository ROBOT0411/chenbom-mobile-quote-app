<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c81"><link rel="manifest" href="manifest.webmanifest">
<title>承邦行動報價單</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef3f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.app{max-width:760px;margin:auto;padding:14px}
.hero{background:linear-gradient(135deg,#0f4c81,#1769aa);color:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px #0f4c8130}
.brand{font-size:13px;opacity:.9}.title{font-size:28px;font-weight:900;margin-top:5px}.sub{opacity:.88;font-size:13px;margin-top:5px}
.card{background:#fff;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 5px 20px #17203310}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{font-size:12px;font-weight:800;color:#475569;display:block;margin-bottom:5px}
input,textarea{width:100%;padding:11px;border:1px solid #d7dee8;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:75px}.items{overflow:auto}.item{display:grid;grid-template-columns:1fr 1.3fr .55fr .65fr .85fr 32px;gap:7px;align-items:end;padding:10px 0;border-bottom:1px solid #edf0f4}
.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800}.primary{background:#0f4c81;color:#fff}.orange{background:#f97316;color:#fff}.light{background:#eef3f8}.danger{background:#fee2e2;color:#b91c1c}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.total{font-size:24px;font-weight:900;color:#0f4c81}
.history button{width:100%;text-align:left;border:0;background:#f8fafc;padding:12px;border-radius:10px;margin-top:8px}.muted{color:#64748b;font-size:12px}
.products button{width:100%;text-align:left;border:1px solid #e5e7eb;background:#f8fafc;padding:10px;border-radius:10px;margin-top:8px}
.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sectionHead .rightBtns{display:flex;gap:8px;flex-wrap:wrap}
#pdfWrap{position:fixed;left:-12000px;top:0;width:816px;height:1056px}
#pdf{width:816px;height:1056px;background:#fff;position:relative;overflow:hidden}
#pdfBg{position:absolute;inset:0;width:816px;height:1056px;display:block}
.pdfv{position:absolute;color:#111;font-family:"DFKai-SB","BiauKai","Noto Serif TC","PMingLiU","Times New Roman",serif;font-size:14px;line-height:20px;font-weight:400;white-space:nowrap;overflow:hidden}
#vCustomer{left:250px;top:354px;width:185px}
#vDate{left:540px;top:351px;width:145px}
#vAddress{left:250px;top:377px;width:250px}
#vPriceTerms{left:540px;top:377px;width:145px}
#vPhone{left:250px;top:406px;width:170px}
#vFax{left:250px;top:432px;width:170px}
#vPayment{left:540px;top:431px;width:180px}
#vContact{left:250px;top:458px;width:75px}
#vDept{left:368px;top:458px;width:80px}
#vDelivery{left:540px;top:458px;width:170px}
.pdfRow{position:absolute;left:0;width:816px;height:25.4px;display:grid;grid-template-columns:67px 124px 192px 48px 50px 69px 102px;align-items:center;font-family:"DFKai-SB","BiauKai","Noto Serif TC","PMingLiU","Times New Roman",serif;font-size:13px;color:#111;line-height:25px}
.pdfRow .c{text-align:center;white-space:nowrap;overflow:hidden}.pdfRow .money{text-align:center}
.pdfRow:nth-child(1){top:524px}.pdfRow:nth-child(2){top:549.4px}.pdfRow:nth-child(3){top:574.8px}.pdfRow:nth-child(4){top:600.2px}.pdfRow:nth-child(5){top:625.6px}.pdfRow:nth-child(6){top:651px}.pdfRow:nth-child(7){top:676.4px}
.pdfTotal{position:absolute;left:606px;width:102px;text-align:center;color:#111;font-family:"DFKai-SB","BiauKai","Noto Serif TC","PMingLiU","Times New Roman",serif;font-size:14px;line-height:24px;white-space:nowrap}
#vSub{top:704px}.pdfTotal#vTax{top:730px}.pdfTotal#vGrand{top:756px;font-weight:700;font-size:15px}
.pdfWarn{margin-top:8px;background:#fff7ed;color:#9a3412;border-radius:10px;padding:8px 10px;font-size:12px}
@media(max-width:620px){
  .grid{grid-template-columns:1fr}.full{grid-column:auto}.actions{grid-template-columns:1fr}
  .item{grid-template-columns:1fr 1fr 1fr;gap:8px}.item .del{grid-column:3;grid-row:1}
  .sectionHead{align-items:stretch}.sectionHead .rightBtns{width:100%}.sectionHead .rightBtns .btn{flex:1}
}
</style>
</head>
<body>
<main class="app">
<section class="hero"><div class="brand">VECTECH / 承邦有限公司</div><div class="title">行動報價單</div><div class="sub">手機建立報價・原始報價單版型・Letter PDF</div></section>
<section class="card"><div class="grid">
<div><label>客戶名稱</label><input id="customer" placeholder="公司名稱"></div>
<div><label>報價日期</label><input id="date" type="date"></div>
<div><label>報價單號</label><input id="quoteNo" readonly></div>
<div><label>有效期限</label><input id="validUntil" value="報價日起30天"></div>
<div class="full"><label>地址</label><input id="address"></div>
<div><label>電話</label><input id="phone"></div><div><label>傳真</label><input id="fax"></div>
<div><label>聯絡人</label><input id="contact"></div><div><label>部門</label><input id="dept"></div>
<div><label>條件價格</label><input id="priceTerms"></div><div><label>付款方式</label><input id="payment"></div>
<div><label>交貨期</label><input id="delivery"></div><div><label>檔名</label><input id="filename" placeholder="例如：報價單_客戶名稱_日期"></div>
</div></section>
<section class="card">
<div class="sectionHead"><b>報價項目（PDF 固定 7 列）</b><div class="rightBtns"><button class="btn light" onclick="quickProduct()">📦 常用產品</button><button class="btn orange" onclick="addItem()">＋ 新增項目</button></div></div>
<div id="items" class="items"></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><label style="margin:0">計入 5% 營業稅</label><input id="tax" type="checkbox" checked style="width:22px;height:22px"></div>
<div style="text-align:right;margin-top:12px">未稅：<b id="subTotal">NT$ 0</b><br>稅額：<b id="taxTotal">NT$ 0</b><div class="total">總計：<span id="grandTotal">NT$ 0</span></div></div>
<div class="pdfWarn">匯出的 PDF 採您提供的空白報價單原版：Letter 尺寸、7 欄、7 列、備註與合計區、下方服務項目、經辦人及大小章位置。</div>
</section>
<section class="card"><label>備註</label><textarea id="remarks" placeholder="供內部紀錄使用"></textarea></section>
<section class="card actions"><button class="btn primary" onclick="saveQuote()">💾 儲存報價</button><button class="btn orange" onclick="generatePDF()">📄 匯出 PDF</button></section>
<section class="card history"><b>最近報價紀錄</b><div id="history"></div></section>
<section class="card"><b>常用產品</b><div class="muted" style="margin-top:6px">可直接輸入產品名稱與單價，之後可快速帶入報價。</div><div id="products" class="products"></div><button class="btn light" style="margin-top:10px" onclick="addProduct()">＋ 新增常用產品</button></section>
</main>

<div id="vCustomer" class="pdfv"></div><div id="vDate" class="pdfv"></div><div id="vAddress" class="pdfv"></div><div id="vPriceTerms" class="pdfv"></div><div id="vPhone" class="pdfv"></div><div id="vFax" class="pdfv"></div><div id="vPayment" class="pdfv"></div><div id="vContact" class="pdfv"></div><div id="vDept" class="pdfv"></div><div id="vDelivery" class="pdfv"></div>
<div id="pdfRows"></div>
<div id="vSub" class="pdfTotal"></div><div id="vTax" class="pdfTotal"></div><div id="vGrand" class="pdfTotal"></div>
</div></div>

<script>
var $=function(id){return document.getElementById(id)};
var items=[];
var money=function(n){return "NT$ "+Math.round(Number(n)||0).toLocaleString("zh-TW")};
var plainMoney=function(n){return Math.round(Number(n)||0).toLocaleString("zh-TW")};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]})};
function fmtDate(v){if(!v)return "";var p=v.split("-");if(p.length!==3)return v;return p[0]+"/"+Number(p[1])+"/"+Number(p[2])}
$("date").value=new Date().toISOString().slice(0,10);
function newQuoteNo(){var d=new Date(),key="cbQuoteSeq_"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"),n=Number(localStorage.getItem(key)||0)+1;localStorage.setItem(key,n);return "CB"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+String(n).padStart(3,"0")}
function ensureQuoteNo(){if(!$("quoteNo").value)$("quoteNo").value=newQuoteNo()}
var defaultProducts=[{name:"VECTECH S8 智能精密焊台",price:0,unit:"台"},{name:"BGA4500 紅外線返修設備",price:0,unit:"台"},{name:"RV-W473N 選擇性波峰焊接設備",price:0,unit:"台"}];
function getProducts(){return JSON.parse(localStorage.getItem("cbProducts")||"null")||defaultProducts}
function renderProducts(){var p=getProducts();$("products").innerHTML=p.map(function(x,i){return '<button onclick="useProduct('+i+')"><b>'+esc(x.name)+'</b><br><span class="muted">'+esc(x.unit)+'　'+money(x.price)+'</span></button>'}).join("")}
function useProduct(i){var p=getProducts()[i];addItem({model:"",name:p.name,qty:1,unit:p.unit||"台",price:Number(p.price)||0});window.scrollTo({top:0,behavior:"smooth"})}
function quickProduct(){$("products").scrollIntoView({behavior:"smooth"})}
function addProduct(){var name=prompt("輸入產品名稱");if(!name)return;var price=Number(prompt("輸入單價","0")||0),unit=prompt("輸入單位","台")||"台",p=getProducts();p.push({name:name,price:price,unit:unit});localStorage.setItem("cbProducts",JSON.stringify(p));renderProducts()}
function addItem(v){if(items.length>=7){alert("原始報價單只有 7 列，請先刪除既有項目。");return}v=v||{model:"",name:"",qty:1,unit:"台",price:0};items.push(v);renderItems()}
function renderItems(){
  $("items").innerHTML=items.map(function(x,i){return '<div class="item">'
  +'<div><label>型號</label><input value="'+esc(x.model)+'" oninput="items['+i+'].model=this.value"></div>'
  +'<div><label>品名</label><input value="'+esc(x.name)+'" oninput="items['+i+'].name=this.value"></div>'
  +'<div><label>數量</label><input type="number" value="'+(x.qty||1)+'" min="0" oninput="items['+i+'].qty=Number(this.value);calc()"></div>'
  +'<div><label>單位</label><input value="'+esc(x.unit||"台")+'" oninput="items['+i+'].unit=this.value"></div>'
  +'<div><label>單價</label><input type="number" value="'+(x.price||0)+'" min="0" oninput="items['+i+'].price=Number(this.value);calc()"></div>'
  +'<button class="btn danger del" onclick="items.splice('+i+',1);renderItems()">×</button></div>'}).join("");
  calc();
}
function calc(){var sub=items.reduce(function(a,x){return a+(Number(x.qty)||0)*(Number(x.price)||0)},0),tax=$("tax").checked?Math.round(sub*.05):0;$("subTotal").textContent=money(sub);$("taxTotal").textContent=money(tax);$("grandTotal").textContent=money(sub+tax);return{sub:sub,tax:tax,total:sub+tax}}
function data(){return{customer:$("customer").value,date:$("date").value,quoteNo:$("quoteNo").value,validUntil:$("validUntil").value,address:$("address").value,phone:$("phone").value,fax:$("fax").value,contact:$("contact").value,dept:$("dept").value,priceTerms:$("priceTerms").value,payment:$("payment").value,delivery:$("delivery").value,filename:$("filename").value,remarks:$("remarks").value,tax:$("tax").checked,items:items.map(function(x){return{model:x.model||"",name:x.name||"",qty:Number(x.qty)||0,unit:x.unit||"",price:Number(x.price)||0}}),savedAt:new Date().toISOString()}}
function saveQuote(){ensureQuoteNo();var d=data(),h=JSON.parse(localStorage.getItem("cbQuotes")||"[]");h.unshift(d);localStorage.setItem("cbQuotes",JSON.stringify(h.slice(0,50)));renderHistory();alert("報價單已儲存\n報價單號："+d.quoteNo)}
function renderHistory(){var h=JSON.parse(localStorage.getItem("cbQuotes")||"[]");$("history").innerHTML=h.length?h.map(function(x,i){var s=(x.items||[]).reduce(function(a,y){return a+(Number(y.qty)||0)*(Number(y.price)||0)},0);return '<button onclick="loadQuote('+i+')"><b>'+esc(x.customer||"未填客戶")+'</b><br><span class="muted">'+(x.date||"")+"　"+money(s)+'</span></button>'}).join(""):'<div class="muted" style="padding:12px 0">尚無紀錄</div>'}
function loadQuote(i){var x=JSON.parse(localStorage.getItem("cbQuotes")||"[]")[i];["customer","date","quoteNo","validUntil","address","phone","fax","contact","dept","priceTerms","payment","delivery","filename","remarks"].forEach(function(k){$(k).value=x[k]||""});$("tax").checked=x.tax!==false;items=(x.items||[]).slice(0,7).map(function(y){return{model:y.model||"",name:y.name||y.product||"",qty:Number(y.qty)||1,unit:y.unit||"台",price:Number(y.price)||0}});renderItems()}
function makePdfRows(list){var html="";for(var i=0;i<7;i++){var x=list[i]||{model:"",name:"",qty:"",unit:"",price:""};html+='<div class="pdfRow"><div class="c">'+(i+1)+'</div><div class="c">'+esc(x.model)+'</div><div class="c">'+esc(x.name)+'</div><div class="c">'+(x.qty===""?"":esc(x.qty))+'</div><div class="c">'+esc(x.unit)+'</div><div class="money">'+(x.price===""?"":plainMoney(x.price))+'</div><div class="money">'+(x.price===""?"":plainMoney((Number(x.qty)||0)*(Number(x.price)||0)))+'</div></div>'}$("pdfRows").innerHTML=html}
function generatePDF(){
  if(items.length>7){alert("原始報價單只支援 7 列。");return}
  ensureQuoteNo();
  var d=data(),t=calc();
  $("vCustomer").textContent=d.customer;
  $("vDate").textContent=fmtDate(d.date);
  $("vAddress").textContent=d.address;
  $("vPriceTerms").textContent=d.priceTerms;
  $("vPhone").textContent=d.phone;
  $("vFax").textContent=d.fax;
  $("vPayment").textContent=d.payment;
  $("vContact").textContent=d.contact;
  $("vDept").textContent=d.dept;
  $("vDelivery").textContent=d.delivery;
  makePdfRows(d.items);
  $("vSub").textContent=plainMoney(t.sub);
  $("vTax").textContent=plainMoney(t.tax);
  $("vGrand").textContent=plainMoney(t.total);
  var name=(d.filename||("報價單_"+(d.customer||"客戶")+"_"+(d.quoteNo||fmtDate(d.date)))).replace(/\.pdf$/i,"")+".pdf";
  html2pdf().set({margin:0,filename:name,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true,allowTaint:false,imageTimeout:0},jsPDF:{unit:"mm",format:"letter",orientation:"portrait"}}).from($("pdf")).save();
}
ensureQuoteNo();addItem();renderHistory();renderProducts();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body></html>
