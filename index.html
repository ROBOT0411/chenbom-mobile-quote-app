<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c81"><link rel="manifest" href="manifest.webmanifest">
<title>承邦行動報價單</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.app{max-width:720px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#0f4c81,#1769aa);color:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px #0f4c8130}.brand{font-size:13px;opacity:.9}.title{font-size:28px;font-weight:900;margin-top:5px}.sub{opacity:.88;font-size:13px;margin-top:5px}
.card{background:#fff;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 5px 20px #17203310}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#475569;display:block;margin-bottom:5px}input,textarea,select{width:100%;padding:11px;border:1px solid #d7dee8;border-radius:10px;font:inherit;background:#fff}textarea{min-height:75px}.items{overflow:auto}.item{display:grid;grid-template-columns:1.5fr .55fr .65fr .85fr 32px;gap:7px;align-items:end;padding:10px 0;border-bottom:1px solid #edf0f4}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800}.primary{background:#0f4c81;color:#fff}.orange{background:#f97316;color:#fff}.light{background:#eef3f8}.danger{background:#fee2e2;color:#b91c1c}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.total{font-size:24px;font-weight:900;color:#0f4c81}.history button{width:100%;text-align:left;border:0;background:#f8fafc;padding:12px;border-radius:10px;margin-top:8px}.muted{color:#64748b;font-size:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.actions{grid-template-columns:1fr}.item{grid-template-columns:1.35fr .5fr .6fr .8fr 32px}}
#pdf{width:794px;min-height:1123px;background:#fff;color:#111;padding:42px;position:relative;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
#pdf h1{text-align:center;font-size:30px;letter-spacing:12px;margin:18px 0;border-bottom:2px solid #111;padding-bottom:8px}
.pdfhead{text-align:center}.pdfhead b{font-size:24px}.pdfmeta{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px;font-size:13px;margin-bottom:16px}.pdftable{width:100%;border-collapse:collapse;font-size:12px}.pdftable th,.pdftable td{border:1px solid #555;padding:7px}.pdftable th{background:#f3f4f6}.pdfsum{margin-left:auto;width:260px;margin-top:0;border-collapse:collapse;font-size:13px}.pdfsum td{border:1px solid #555;padding:7px}.pdfnotes{font-size:12px;margin-top:18px;white-space:pre-line;max-width:100%}.stamp{position:absolute;right:40px;bottom:30px;width:170px;height:80px;display:flex;justify-content:flex-end;align-items:flex-end;gap:8px}.stamp img{max-width:170px;max-height:80px;object-fit:contain}
#pdfWrap{position:fixed;left:-10000px;top:0}
</style></head>
<body><main class="app">
<section class="hero"><div class="brand">VECTECH / 承邦有限公司</div><div class="title">行動報價單</div><div class="sub">手機建立報價・自動計算・A4 PDF 匯出・報價紀錄</div></section>
<section class="card"><div class="grid">
<div><label>客戶名稱</label><input id="customer" placeholder="公司名稱"></div>
<div><label>報價日期</label><input id="date" type="date"></div>
<div class="full"><label>地址</label><input id="address"></div>
<div><label>電話</label><input id="phone"></div><div><label>傳真</label><input id="fax"></div>
<div><label>聯絡人</label><input id="contact"></div><div><label>部門</label><input id="dept"></div>
<div><label>條件價格</label><input id="priceTerms" value="台灣含稅"></div><div><label>付款方式</label><input id="payment" value="月結30天"></div>
<div><label>交貨期</label><input id="delivery" value="收到訂單後4-6週"></div><div><label>檔名</label><input id="filename" placeholder="例如：報價單_客戶名稱_日期"></div>
</div></section>
<section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>報價項目</b><button class="btn orange" onclick="addItem()">＋ 新增項目</button></div><div id="items" class="items"></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><label style="margin:0">營業稅 5%</label><input id="tax" type="checkbox" checked style="width:22px;height:22px"></div>
<div style="text-align:right;margin-top:12px">未稅：<b id="subTotal">NT$ 0</b><br>稅額：<b id="taxTotal">NT$ 0</b><div class="total">總計：<span id="grandTotal">NT$ 0</span></div></div></section>
<section class="card"><label>備註</label><textarea id="remarks" placeholder="報價有效期限、補充說明等"></textarea></section>
<section class="card actions"><button class="btn primary" onclick="saveQuote()">💾 儲存報價</button><button class="btn orange" onclick="generatePDF()">📄 匯出 A4 PDF</button></section>
<section class="card history"><b>最近報價紀錄</b><div id="history"></div></section>
</main>
<div id="pdfWrap"><div id="pdf">
<div class="pdfhead"><b>承邦有限公司</b><div>CHEN BOM TRADING CO., LTD.</div><div style="font-size:12px">Tel: 02-8647-2988　 Fax: 02-8647-2977　 www.cbtrade.com.tw</div></div>
<h1>報　價　單</h1><div class="pdfmeta" id="pdfMeta"></div><table class="pdftable"><thead><tr><th>項目</th><th>型號品名</th><th>數量</th><th>單位</th><th>單價</th><th>合計</th></tr></thead><tbody id="pdfItems"></tbody></table>
<table class="pdfsum"><tr><td>未稅合計</td><td id="pSub"></td></tr><tr><td>5%營業稅</td><td id="pTax"></td></tr><tr><td><b>總計</b></td><td id="pGrand"><b></b></td></tr></table>
<div class="pdfnotes" id="pdfNotes"></div>
<div class="stamp"><img id="pdfStamp" src="assets/image_2.jpeg" crossorigin="anonymous" alt="公司大小章" onerror="this.style.display='none'"></div>
</div></div>
<script>
const $=id=>document.getElementById(id);let items=[];
const money=n=>"NT$ "+Math.round(Number(n)||0).toLocaleString("zh-TW");
$("date").value=new Date().toISOString().slice(0,10);
function addItem(v={name:"",qty:1,unit:"台",price:0}){items.push(v);renderItems()}
function renderItems(){ $("items").innerHTML=items.map((x,i)=>`<div class="item">
<div><label>型號品名</label><input value="${esc(x.name)}" oninput="items[${i}].name=this.value"></div>
<div><label>數量</label><input type="number" value="${x.qty}" min="0" oninput="items[${i}].qty=+this.value;calc()"></div>
<div><label>單位</label><input value="${esc(x.unit)}" oninput="items[${i}].unit=this.value"></div>
<div><label>單價</label><input type="number" value="${x.price}" min="0" oninput="items[${i}].price=+this.value;calc()"></div>
<button class="btn danger" onclick="items.splice(${i},1);renderItems()">×</button></div>`).join("");calc()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function calc(){let sub=items.reduce((a,x)=>a+(+x.qty||0)*(+x.price||0),0),tax=$("tax").checked?Math.round(sub*.05):0;$("subTotal").textContent=money(sub);$("taxTotal").textContent=money(tax);$("grandTotal").textContent=money(sub+tax);return{sub,tax,total:sub+tax}}
function data(){return{customer:$("customer").value,date:$("date").value,address:$("address").value,phone:$("phone").value,fax:$("fax").value,contact:$("contact").value,dept:$("dept").value,priceTerms:$("priceTerms").value,payment:$("payment").value,delivery:$("delivery").value,filename:$("filename").value,remarks:$("remarks").value,tax:$("tax").checked,items:[...items],savedAt:new Date().toISOString()}}
function saveQuote(){const d=data();let h=JSON.parse(localStorage.getItem("cbQuotes")||"[]");h.unshift(d);localStorage.setItem("cbQuotes",JSON.stringify(h.slice(0,50)));renderHistory();alert("報價單已儲存")}
function renderHistory(){let h=JSON.parse(localStorage.getItem("cbQuotes")||"[]");$("history").innerHTML=h.length?h.map((x,i)=>`<button onclick="loadQuote(${i})"><b>${esc(x.customer||"未填客戶")}</b><br><span class="muted">${x.date||""}　${money((x.items||[]).reduce((a,y)=>a+(+y.qty||0)*(+y.price||0),0))}</span></button>`).join(""):'<div class="muted" style="padding:12px 0">尚無紀錄</div>'}
function loadQuote(i){let x=JSON.parse(localStorage.getItem("cbQuotes")||"[]")[i];["customer","date","address","phone","fax","contact","dept","priceTerms","payment","delivery","filename","remarks"].forEach(k=>$(k).value=x[k]||"");$("tax").checked=x.tax!==false;items=x.items||[];renderItems()}
function generatePDF(){const d=data(),t=calc();$("pdfMeta").innerHTML=[["客戶名稱",d.customer],["日期",d.date],["地址",d.address],["條件價格",d.priceTerms],["電話",d.phone],["付款方式",d.payment],["傳真",d.fax],["交貨期",d.delivery],["聯絡人",d.contact],["部門",d.dept]].map(x=>`<div><b>${x[0]}：</b>${esc(x[1])}</div>`).join("");$("pdfItems").innerHTML=items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${esc(x.unit)}</td><td style="text-align:right">${money(x.price)}</td><td style="text-align:right">${money((+x.qty||0)*(+x.price||0))}</td></tr>`).join("");$("pSub").textContent=money(t.sub);$("pTax").textContent=money(t.tax);$("pGrand").innerHTML="<b>"+money(t.total)+"</b>";$("pdfNotes").textContent=d.remarks||"";const name=(d.filename||("報價單_"+(d.customer||"客戶")+"_"+d.date)).replace(/\.pdf$/i,"")+".pdf";html2pdf().set({margin:0,filename:name,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true,allowTaint:false},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}}).from($("pdf")).save()}
addItem();renderHistory();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
